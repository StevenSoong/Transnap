name: 缺陷报告
description: 报告可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿粘贴接口密钥、私人翻译内容或未脱敏日志。
  - type: input
    id: version
    attributes:
      label: Transnap 版本
      placeholder: 例如 1.10.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 与硬件
      placeholder: 例如 macOS 15.6 / Apple M3
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. …\n2. …\n3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
