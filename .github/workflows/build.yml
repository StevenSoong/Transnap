name: Build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run self-tests
        run: ./scripts/test.sh

      - name: Build app bundle
        run: ./scripts/build-app.sh release

      - name: Verify signature
        run: codesign --verify --deep --strict dist/Transnap.app
